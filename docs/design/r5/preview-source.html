<div class="review-controls" aria-label="视觉评审设置"><div><span class="label">生态主题</span><div class="segment"><button data-action="theme" data-value="forest" aria-pressed="true">林下</button><button data-action="theme" data-value="pond" aria-pressed="false">浅塘</button></div></div><div><span class="label">桌面背景</span><div class="segment"><button data-action="bg" data-value="light" aria-pressed="true">浅色</button><button data-action="bg" data-value="dark" aria-pressed="false">深色</button><button data-action="bg" data-value="busy" aria-pressed="false">繁复</button></div></div><div class="options"><label class="option scene-selector"><input id="cleanplate" type="checkbox">只看无动物底图</label><label class="option"><input id="reduce-transparency" type="checkbox">减少透明度</label><label class="option"><input id="reduce-motion" type="checkbox">减少动态效果</label></div></div>
<section class="test-surface" aria-label="玻璃材质和生态画面预览"><div class="surface-top"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>微缩生态</div><nav class="view-tabs glass" aria-label="评审视图" role="tablist"><button role="tab" data-action="view" data-value="desktop" aria-selected="true">桌面组件</button><button role="tab" data-action="view" data-value="editor" aria-selected="false">编辑工作台</button><button role="tab" data-action="view" data-value="assets" aria-selected="false">美术素材</button><button role="tab" data-action="view" data-value="scale" aria-selected="false">比例与观察</button></nav></div><main id="preview" role="tabpanel" aria-label="当前设计视图"></main><div class="surface-footer"><span>R5 美术样稿 · 尺度与空间研究</span><span>玻璃效果为网页近似，桌面原生材质另行验证。</span></div></section>
<footer class="page-note"><p>这是独立美术评审页。局部观察放大的是整幅场景；比例图是设计参照。生态读数、投放、保存和 Windows 桌面行为未连接。</p><span>提示：在“比例与观察”中查看统一测量线与画幅换算。</span></footer>
</div>
<dialog class="dialog" id="image-dialog" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title">美术样稿</h2><span class="badge">设计预览</span><button class="soft-button" data-action="zoom" aria-pressed="false">原尺寸</button><button class="soft-button" data-action="close-image">关闭大图</button></header><div class="dialog-image" id="dialog-image-wrap"><img id="dialog-image" alt=""></div></dialog>
<script>
(()=>{'use strict';
// Canonical asset keys are filenames for the five new images, and complete
// references/r4-shape-studies/... paths for the two retained shape boards.
const S={view:'desktop',theme:'forest',bg:'light',idle:false,tool:'object',drawer:false,plate:false,magnification:1,region:0};
const themes={
 forest:{name:'林下微光',label:'450 mm 参考平面',file:'forest-keyart.png',board:'references/r4-shape-studies/forest-expansion-board.png',boardName:'林下物件造型参考',light:'树隙散光',space:'林床近景',span:450,life:'鼠妇与微小生命',text:'以木段、落叶与石块共同建立尺度，让动物贴合各自的活动表面。',regions:[{name:'树皮',x:28,y:42},{name:'地表',x:42,y:73},{name:'叶缘',x:66,y:72}]},
 pond:{name:'浅塘日光',label:'600 mm 参考平面',file:'pond-keyart.png',board:'references/r4-shape-studies/pond-expansion-board.png',boardName:'浅塘物件造型参考',light:'水下碎光',space:'浅水近景',span:600,life:'米虾与微小生命',text:'以沉木、水草叶片和底石建立尺度，用接触、遮挡与水层表现深度。',regions:[{name:'沉木',x:30,y:57},{name:'水层',x:56,y:54},{name:'叶缘',x:71,y:82}]}
};
const measurements=[
 {theme:'林下',name:'鼠妇',part:'体长',mm:12,span:450},
 {theme:'林下',name:'弹尾虫',part:'体长',mm:1.5,span:450},
 {theme:'林下',name:'陆生蜗牛',part:'壳宽',mm:6,span:450},
 {theme:'浅塘',name:'米虾',part:'体长',mm:20,span:600},
 {theme:'浅塘',name:'水蚤',part:'躯干长',mm:2,span:600},
 {theme:'浅塘',name:'淡水螺',part:'壳宽',mm:8,span:600}
];
const $=s=>document.querySelector(s),preview=$('#preview'),dialog=$('#image-dialog');
let returnFocus=null;
const asset=file=>(window.R5_ASSETS||{})[file]||(file.startsWith('references/')?file:'assets/'+file);
const sceneFile=t=>S.plate?t.file.replace('-keyart','-cleanplate'):t.file;
const icon=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+({object:'<path d="M5 3l13 9-7 1-4 7z"/>',environment:'<path d="M5 20v-7m7 7V4m7 16v-11M3 20h18"/>',biology:'<path d="M8 8c0-6 8-6 8 0v8c0 5-8 5-8 0zM8 12h8M5 7l3 3m11-3l-3 3M4 14h4m8 0h4M5 21l3-4m11 4l-3-4"/>',content:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',expand:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/>',moon:'<path d="M20 15A9 9 0 0 1 9 4a8 8 0 1 0 11 11z"/>'}[name]||'')+'</svg>';
function scene(idle=false){const t=themes[S.theme],r=t.regions[S.region],k=S.magnification;const left=Math.max(100-100*k,Math.min(0,50-r.x*k)),top=Math.max(100-100*k,Math.min(0,50-r.y*k));return '<div class="scene" data-observation="'+k+'"><img src="'+asset(sceneFile(t))+'" alt="'+t.name+(S.plate?'无动物底图':'含动物构图样稿')+'" style="width:'+100*k+'%;height:'+100*k+'%;left:'+left+'%;top:'+top+'%" '+(idle?'':'data-action="open-image" data-file="'+sceneFile(t)+'" data-title="'+t.name+' · 全幅样稿" tabindex="0" role="button" aria-label="查看'+t.name+'全幅样稿"')+'>'+(idle?'<button class="idle-mask" data-action="wake" aria-label="恢复清晰的生态画面"><span class="time" data-clock></span><span class="date" data-date></span><small>点击恢复画面</small></button>':'')+'</div>'}
function observationControls(){const t=themes[S.theme];return '<div class="observation-controls" aria-label="整体场景观察控制"><span class="label">观察</span><div class="observation-group" aria-label="观察倍率">'+[1,2,4].map(k=>'<button class="soft-button" data-action="magnify" data-value="'+k+'" aria-pressed="'+(S.magnification===k)+'">'+(k===1?'整体':k+'×')+'</button>').join('')+'</div><div class="observation-group" aria-label="观察区域">'+t.regions.map((r,i)=>'<button class="soft-button" data-action="region" data-value="'+i+'" aria-pressed="'+(S.magnification>1&&S.region===i)+'">'+r.name+'</button>').join('')+'</div><span class="observation-status">'+(S.magnification===1?'整体画面':S.magnification+'× 局部观察 · '+t.regions[S.region].name)+' · 场景与生物同比放大 · 静态美术样稿</span></div>'}
const row=(a,b)=>'<div class="detail-row"><span>'+a+'</span><strong>'+b+'</strong></div>';
function desktop(){const t=themes[S.theme];return '<div class="desktop-layout"><section class="eco-widget glass"><header class="eco-head"><strong>'+t.name+'</strong><span class="muted">'+t.label+'</span><button class="soft-button" data-action="open-image" data-file="'+sceneFile(t)+'" data-title="'+t.name+' · 全幅样稿">'+icon('expand')+'全图</button></header>'+scene(S.idle)+observationControls()+'<div class="eco-foot"><span>不同生物保留大小差异</span><span>设计参照 · 待生产校准</span></div></section><aside class="desktop-aside"><section class="clock-widget glass" aria-label="设备当前时间"><div class="time" data-clock></div><div class="date" data-date></div><div class="clock-label">此刻 · 设备时间</div></section><section class="info-widget glass"><h3>'+t.name+'</h3>'+row('参考平面宽',t.span+' mm')+row('观察倍率',S.magnification===1?'整体':S.magnification+'×')+'<div class="micro-divider"></div><p>细小生命可在局部观察中查看。这里的 mm 表示设计中的世界尺度。</p></section></aside></div><div class="desktop-actions"><button class="soft-button" data-action="idle" aria-pressed="'+S.idle+'">'+icon('moon')+(S.idle?'恢复清晰画面':'预览闲置时钟')+'</button><button class="soft-button" data-action="view" data-value="scale">查看比例与观察</button><span class="muted">液态玻璃容器 · 像素画面保持清晰</span></div>'}
function inspector(){const t=themes[S.theme];if(S.tool==='environment')return '<div class="inspector-title">'+icon('environment')+'环境概览</div><h2>环境读数</h2><p>此页仅展示信息位置，未连接生态模型。</p><div class="readout"><div><small>温度</small><strong>—</strong></div><div><small>'+(S.theme==='forest'?'湿度':'溶氧')+'</small><strong>—</strong></div></div><section class="inspector-section"><h3>空间与环境</h3><p>更精细的水层、苔藓和土壤画面，不代表已经增加局部温湿度或溶氧模拟。</p></section>';if(S.tool==='biology'){const rows=measurements.filter(m=>m.theme===(S.theme==='forest'?'林下':'浅塘'));return '<div class="inspector-title">'+icon('biology')+'生物观察</div><h2>'+t.life+'</h2><p>下列数值为选定的设计参照，测量部位分别标明。</p>'+rows.map(m=>row(m.name+' · '+m.part,m.mm+' mm')).join('')+'<button class="soft-button" data-action="view" data-value="scale">查看同倍率测量线</button><button class="soft-button" data-action="open-image" data-file="creature-morphology-study.png" data-title="生物形态研究 · 各项独立放大，非同尺度">形态观察 · 独立放大</button><section class="inspector-section"><p>图中数量不代表种群数量；微小生物的聚合身份和新增候选仍需工程审查。</p></section>'}return '<div class="inspector-title">'+icon('object')+'场景属性</div><h2>'+t.name+'</h2><p>'+t.text+'</p><section class="inspector-section"><h3>尺度与画面</h3>'+row('参考平面宽',t.span+' mm')+row('比例核对基准','960 px 宽')+row('视角','固定主视角')+row('光照',t.light)+'</section><button class="soft-button" data-action="open-image" data-file="'+t.board+'" data-title="'+t.boardName+' · 尺寸以R5规范为准">查看物件造型参考</button><section class="inspector-section"><p>本页不移动画面中的物件；真实放置、占地与遮挡需要后续接入。</p></section>'}
function editor(){const t=themes[S.theme];return '<section class="editor glass"><header class="editor-head"><strong>'+t.name+'</strong><span class="muted small">编辑工作台</span><span class="badge">场景与任务区域分别占位</span></header><div class="editor-workspace"><nav class="tool-rail" aria-label="当前工作台工具">'+[['object','属性'],['environment','环境'],['biology','生物']].map(([v,label])=>'<button class="tool" data-action="tool" data-value="'+v+'" aria-pressed="'+(S.tool===v)+'">'+icon(v)+label+'</button>').join('')+'<button class="tool" data-action="drawer" aria-pressed="'+S.drawer+'">'+icon('content')+'内容</button></nav><div class="editor-canvas"><div class="scene-holder">'+scene()+'</div><div class="canvas-caption"><span>'+t.span+' mm 参考平面 · '+(S.plate?'无动物底图':'含动物构图')+'</span><button data-action="open-image" data-file="'+sceneFile(t)+'" data-title="'+t.name+' · 全幅样稿">全图查看</button></div>'+observationControls()+'<section class="content-drawer"><button class="drawer-title" data-action="drawer" aria-expanded="'+S.drawer+'"><span>造景与生命 · 样稿参考</span><span>'+(S.drawer?'收起 −':'展开 ＋')+'</span></button>'+(S.drawer?'<div class="drawer-items"><button class="drawer-item" data-action="open-image" data-file="'+t.board+'" data-title="'+t.boardName+' · 尺寸以R5规范为准">'+t.boardName+'<small>沿用造型参考，尺寸以R5规范为准</small></button><button class="drawer-item" data-action="open-image" data-file="creature-morphology-study.png" data-title="生物形态研究 · 各项独立放大，非同尺度">生物形态研究<small>独立放大 · 非同尺度排列</small></button></div>':'')+'</section></div><aside class="inspector">'+inspector()+'</aside></div><footer class="editor-note">独立设计预览 · 不连接生态读数、投放或保存。</footer></section>'}
function assets(){const list=[['references/r4-shape-studies/forest-expansion-board.png','林下物件造型参考','保留石木、落叶、苔藓与蕨类的造型方向。落地尺寸与接触关系按照 R5 重新校准。','沿用造型参考，尺寸以R5规范为准'],['references/r4-shape-studies/pond-expansion-board.png','浅塘物件造型参考','保留沉木、水草、石组与底床的造型方向。各模块须使用统一相机与世界单位。','沿用造型参考，尺寸以R5规范为准'],['creature-morphology-study.png','生物形态研究','为辨认轮廓而分别放大展示。每项并非同一倍率；真实尺寸差异请查看“比例与观察”。','独立放大展示 · 非同尺度']];return '<div class="library-heading"><div><h2>形态与尺寸分别检查</h2><p>保留补充内容，同时校准它们进入同一个世界后的比例。</p></div><span class="badge">可放大 · 未切分素材</span></div><div class="asset-grid">'+list.map(([file,title,text,tag])=>'<article class="asset-card glass"><button class="asset-image" data-action="open-image" data-file="'+file+'" data-title="'+title+' · '+tag+'" aria-label="放大'+title+'"><img src="'+asset(file)+'" alt="'+title+'"></button><div class="asset-copy"><h3>'+title+'</h3><p>'+text+'</p><span class="badge" style="white-space:normal">'+tag+'</span></div></article>').join('')+'</div><p class="library-note">29 个资产族的扩充计划继续保留。当前图稿用于形态与构图评审；切片、透明边缘、锚点、动画、碰撞和模型接入分别验收。</p>'}
function scaleRuler(){const x=220,pxPerMm=10;let guides='',marks='',rows='';for(let mm=0;mm<=20;mm+=5){const at=x+mm*pxPerMm;guides+='<line class="guide" x1="'+at+'" x2="'+at+'" y1="46" y2="337"/>';marks+='<line class="tick" x1="'+at+'" x2="'+at+'" y1="33" y2="41"/><text x="'+at+'" y="24" font-size="12" text-anchor="middle">'+mm+'</text>'}measurements.forEach((m,i)=>{const y=74+i*45,end=x+m.mm*pxPerMm;rows+='<text x="7" y="'+(y-5)+'" font-size="14">'+m.name+' · '+m.part+'</text><text x="7" y="'+(y+13)+'" font-size="12" opacity=".65">'+m.theme+'</text><line class="measure" x1="'+x+'" x2="'+end+'" y1="'+y+'" y2="'+y+'"/><line class="cap" x1="'+x+'" x2="'+x+'" y1="'+(y-6)+'" y2="'+(y+6)+'"/><line class="cap" x1="'+end+'" x2="'+end+'" y1="'+(y-6)+'" y2="'+(y+6)+'"/><text x="450" y="'+(y+5)+'" font-size="14">'+m.mm+' mm</text>'});return '<svg class="scale-ruler" viewBox="0 0 510 350" width="510" height="350" role="img" aria-label="统一测量线：鼠妇体长12毫米，弹尾虫1.5毫米，陆螺壳宽6毫米，米虾体长20毫米，水蚤躯干2毫米，淡水螺壳宽8毫米。每毫米对应10图示单位。"><text x="7" y="24" font-size="12">同一图示倍率</text>'+guides+marks+rows+'</svg>'}
function scaleView(){const t=themes[S.theme];return '<header class="scale-intro"><h2>看整体，也看微小生命</h2><p>主画面保留不同生物的大小差异。切换 2×、4× 时，环境与动物一起放大；选择一个区域，就能查看对应的局部。这里观察的是静态构图样稿。</p></header><section class="observatory glass"><header class="observatory-head"><h3>'+t.name+'</h3><span class="badge">参考平面宽 '+t.span+' mm · '+(S.plate?'无动物底图':'含动物构图样稿')+'</span></header>'+scene()+observationControls()+'</section><div class="scale-panels"><section class="scale-panel glass"><h3>同一倍率的测量线</h3><p>每 1 mm 参照尺寸对应 10 个 SVG 图示单位。线段只表达标注部位的长度；壳宽与体长使用各自的测量定义。</p><div class="ruler-wrap">'+scaleRuler()+'</div><p class="fine">这些是选定的设计参照个体，不是物种鉴定或所有成体的固定值。图示单位与显示器上的物理毫米不同，浏览器缩放也会改变显示大小。</p></section><section class="scale-panel glass"><h3>放回场景后的大小</h3><div class="formula">参考平面投影长度 = 参照尺寸 ÷ 参考平面画幅宽 × 960 px<br>林下：450 mm；浅塘：600 mm。</div><div class="scale-table-wrap"><table class="scale-table"><thead><tr><th>参照部位</th><th>世界尺寸</th><th>960 px 画幅中</th></tr></thead><tbody>'+measurements.map(m=>'<tr><td>'+m.name+' · '+m.part+'</td><td>'+m.mm+' mm</td><td>'+(m.mm/m.span*960).toFixed(1)+' px</td></tr>').join('')+'</tbody></table></div><p>这一换算用于同一参考平面的尺度核对。姿态、前后位置与相机投影仍需在生产素材中统一校准。</p><p class="fine">960 px 是本轮比例核对基准，未据此宣称引擎分辨率已迁移；概念图也不保证逐像素严格满足这些尺寸。</p></section></div><div class="scale-callout">形态研究板中的动物分别放大以便辨认，不用于判断相对大小。主场景中的微小生物可以很小；提高观察倍率时，周围的叶片、木纹和颗粒也应同步放大。</div>'}
function updateClock(){const d=new Date();document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}));document.querySelectorAll('[data-date]').forEach(e=>e.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}))}
function render(){const focus=document.activeElement,key=focus&&focus.dataset?{action:focus.dataset.action,value:focus.dataset.value}:null;const candidates=key?[...document.querySelectorAll('[data-action]')].filter(b=>b.dataset.action===key.action&&b.dataset.value===key.value):[],ordinal=candidates.indexOf(focus);preview.innerHTML=({desktop,editor,assets,scale:scaleView}[S.view]||desktop)();document.querySelectorAll('[data-action="view"][role="tab"]').forEach(b=>{const on=b.dataset.value===S.view;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});document.querySelectorAll('[data-action="theme"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===S.theme)));document.querySelectorAll('[data-action="bg"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===S.bg)));document.body.dataset.bg=S.bg;updateClock();if(focus&&!document.contains(focus)&&key&&key.action){const matches=[...document.querySelectorAll('[data-action]')].filter(b=>b.dataset.action===(key.action==='wake'?'idle':key.action)&&b.dataset.value===key.value),next=matches[ordinal]||matches[0];if(next)next.focus({preventScroll:true})}}
function openImage(file,title){returnFocus=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-image').src=asset(file);$('#dialog-image').alt=title;$('#dialog-image-wrap').classList.remove('original');document.querySelector('[data-action="zoom"]').setAttribute('aria-pressed','false');dialog.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='open-image'){openImage(b.dataset.file,b.dataset.title);return}if(a==='close-image'){dialog.close();return}if(a==='zoom'){const on=$('#dialog-image-wrap').classList.toggle('original');b.setAttribute('aria-pressed',String(on));return}if(a==='theme'){S.theme=v;S.region=0;S.magnification=1;S.idle=false}else if(a==='bg')S.bg=v;else if(a==='view'){S.view=v;S.idle=false}else if(a==='tool')S.tool=v;else if(a==='drawer')S.drawer=!S.drawer;else if(a==='idle')S.idle=!S.idle;else if(a==='wake')S.idle=false;else if(a==='magnify'){S.magnification=Number(v);S.idle=false}else if(a==='region'){S.region=Number(v);S.magnification=Math.max(2,S.magnification);S.idle=false}render()});
document.addEventListener('keydown',e=>{const b=e.target.closest('[data-action="open-image"][role="button"]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openImage(b.dataset.file,b.dataset.title)}if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role="tab"]')],i=tabs.indexOf(e.target),n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;S.view=tabs[n].dataset.value;S.idle=false;render();tabs[n].focus()}});
$('#cleanplate').addEventListener('change',e=>{S.plate=e.target.checked;render()});$('#reduce-transparency').addEventListener('change',e=>document.body.classList.toggle('reduced-transparency',e.target.checked));$('#reduce-motion').addEventListener('change',e=>document.body.classList.toggle('reduced-motion',e.target.checked));dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});dialog.addEventListener('close',()=>{if(returnFocus&&document.contains(returnFocus))returnFocus.focus({preventScroll:true})});render();setInterval(updateClock,30000);
})();
</script>
</body>
</html>
