[package]
name = "micro-ecosystem-desktop"
version = "0.2.20"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.7", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
world-runtime = { path = "../../../crates/world-runtime" }

[features]
custom-protocol = ["tauri/custom-protocol"]
